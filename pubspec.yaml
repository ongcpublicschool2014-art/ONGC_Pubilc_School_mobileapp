name: school_fees_app
description: School Fees Payment Mobile Application
version: 0.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fonts -- the FIT School desktop "Peacock" typefaces
  google_fonts: ^6.3.3

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Supabase
  supabase_flutter: ^2.3.4

  # Routing
  go_router: ^13.0.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  flutter_svg: ^2.2.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  confetti: ^0.8.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  pinput: ^3.0.1

  # Payments
  # Paytm JS Checkout runs inside a WebView (WEB channel / fallback)
  webview_flutter: ^4.7.0
  # Paytm All-in-One SDK (native, WAP channel test). Vendored + patched for
  # Flutter v2 embedding + IOBPAY host. See third_party/paytm_allinonesdk.
  paytm_allinonesdk:
    path: third_party/paytm_allinonesdk

  # PDF & Receipts
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2

  # Sharing
  share_plus: ^7.2.2

  # Utilities
  intl: any
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2

  # HTTP Client for SMS Gateway
  http: ^1.2.0

  # In-app APK auto-update (Android direct-APK distribution)
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0

  # Icons
  flutter_feather_icons: ^2.0.0+1
  iconsax: ^0.0.8

  # Notifications & Background Tasks
  awesome_notifications: ^0.10.0
  responsive_builder2: ^0.9.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.1

# App launcher icon — Educore 360 logo (assets/images/app_icon.png).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#4A6CD4"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/bold/
    - assets/icons/linear/
    - assets/fonts/
    - assets/Onboard and Welcome Screen Gif/
    - assets/Authendication gif/
    - assets/nav bar icons/
    - assets/school Icons/
    - assets/main icons/fill icons/
    - assets/main icons/line icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
